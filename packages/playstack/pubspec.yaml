name: playstack
description: >-
  Short-video feeds and native video playback for Flutter: a one-widget reels
  feed with replaceable controls, player pooling, preloading and lifecycle
  management.
version: 0.2.0
homepage: https://github.com/ANILSRGT/playstack
repository: https://github.com/ANILSRGT/playstack/tree/main/packages/playstack
issue_tracker: https://github.com/ANILSRGT/playstack/issues
topics:
  - video
  - video-player
  - media
  - feed
  - preload
screenshots:
  - description: >-
      The demo app: a reels feed with a like and drag-to-seek previews, a
      drama series with skip intro, a poll, a pre-roll ad and an
      interstitial, then a live stream.
    path: doc/demo.webp
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: playstack_android
      ios:
        default_package: playstack_ios
      web:
        default_package: playstack_web

dependencies:
  flutter:
    sdk: flutter
  playstack_platform_interface: ^0.2.0
  playstack_android: ^0.2.0
  playstack_ios: ^0.2.0
  playstack_web: ^0.2.0
  http: ^1.6.0
  xml: ^7.1.0

dev_dependencies:
  playstack_test: ^0.2.0
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
