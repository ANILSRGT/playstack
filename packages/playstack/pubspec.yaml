name: playstack
description: >-
  Short-video feeds and native video playback for Flutter: a one-widget reels
  feed with replaceable controls, player pooling, preloading and lifecycle
  management.
version: 0.1.0-dev.8
homepage: https://github.com/ANILSRGT/playstack
repository: https://github.com/ANILSRGT/playstack/tree/main/packages/playstack
issue_tracker: https://github.com/ANILSRGT/playstack/issues
topics:
  - video
  - video-player
  - media
  - feed
  - preload
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: playstack_android
      ios:
        default_package: playstack_ios
      web:
        default_package: playstack_web

dependencies:
  flutter:
    sdk: flutter
  playstack_platform_interface: ^0.1.0-dev.8
  playstack_android: ^0.1.0-dev.8
  playstack_ios: ^0.1.0-dev.8
  playstack_web: ^0.1.0-dev.8

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
