name: playstack_android
description: Android implementation of PlayStack, built on AndroidX Media3 ExoPlayer.
version: 0.1.0-dev.8
homepage: https://github.com/ANILSRGT/playstack
repository: https://github.com/ANILSRGT/playstack/tree/main/packages/playstack_android
issue_tracker: https://github.com/ANILSRGT/playstack/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: playstack
    platforms:
      android:
        package: dev.playstack.android
        pluginClass: PlayStackPlugin
        dartPluginClass: PlayStackAndroid

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  playstack_platform_interface: ^0.1.0-dev.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
