name: playstack_cast
description: >-
  Chromecast for PlayStack: a cast button, device picker and remote
  playback of PlayStack videos on Google Cast receivers.
version: 0.2.0
homepage: https://github.com/ANILSRGT/playstack
repository: https://github.com/ANILSRGT/playstack/tree/main/packages/playstack_cast
issue_tracker: https://github.com/ANILSRGT/playstack/issues
topics:
  - video
  - chromecast
  - cast
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    platforms:
      android:
        package: dev.playstack.cast
        pluginClass: PlayStackCastPlugin
      ios:
        pluginClass: PlayStackCastPlugin

dependencies:
  flutter:
    sdk: flutter
  playstack: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
