name: playstack_ios
description: iOS implementation of PlayStack, built on AVFoundation AVPlayer.
version: 0.1.0-dev.8
homepage: https://github.com/ANILSRGT/playstack
repository: https://github.com/ANILSRGT/playstack/tree/main/packages/playstack_ios
issue_tracker: https://github.com/ANILSRGT/playstack/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: playstack
    platforms:
      ios:
        pluginClass: PlayStackPlugin
        dartPluginClass: PlayStackIOS

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  playstack_platform_interface: ^0.1.0-dev.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
