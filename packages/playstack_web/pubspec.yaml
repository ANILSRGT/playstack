name: playstack_web
description: Web implementation of PlayStack, the Flutter video feed and playback plugin, built on HTMLVideoElement.
version: 0.1.0-dev.8
homepage: https://github.com/ANILSRGT/playstack
repository: https://github.com/ANILSRGT/playstack/tree/main/packages/playstack_web
issue_tracker: https://github.com/ANILSRGT/playstack/issues
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: playstack
    platforms:
      web:
        pluginClass: PlayStackWeb
        fileName: playstack_web.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  playstack_platform_interface: ^0.1.0-dev.8
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
