name: reelkit
description: >-
  Short-video feeds and native video playback for Flutter: a one-widget reels
  feed with replaceable controls, player pooling, preloading and lifecycle
  management.
version: 0.1.0-dev.7
homepage: https://github.com/ANILSRGT/reelkit
repository: https://github.com/ANILSRGT/reelkit/tree/main/packages/reelkit
issue_tracker: https://github.com/ANILSRGT/reelkit/issues
topics:
  - video
  - video-player
  - media
  - feed
  - preload
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: reelkit_android
      ios:
        default_package: reelkit_ios
      web:
        default_package: reelkit_web

dependencies:
  flutter:
    sdk: flutter
  reelkit_platform_interface: ^0.1.0-dev.7
  reelkit_android: ^0.1.0-dev.7
  reelkit_ios: ^0.1.0-dev.7
  reelkit_web: ^0.1.0-dev.7

dev_dependencies:
  fake_async: ^1.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
