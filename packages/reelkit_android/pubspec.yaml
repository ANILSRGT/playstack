name: reelkit_android
description: Android implementation of ReelKit, built on AndroidX Media3 ExoPlayer.
version: 0.1.0-dev.5
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: reelkit
    platforms:
      android:
        package: dev.reelkit.android
        pluginClass: ReelKitPlugin
        dartPluginClass: ReelKitAndroid

dependencies:
  flutter:
    sdk: flutter
  reelkit_platform_interface: ^0.1.0-dev.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
