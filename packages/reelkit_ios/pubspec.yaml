name: reelkit_ios
description: iOS implementation of ReelKit, built on AVFoundation AVPlayer.
version: 0.1.0-dev.7
homepage: https://github.com/ANILSRGT/reelkit
repository: https://github.com/ANILSRGT/reelkit/tree/main/packages/reelkit_ios
issue_tracker: https://github.com/ANILSRGT/reelkit/issues
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: reelkit
    platforms:
      ios:
        pluginClass: ReelKitPlugin
        dartPluginClass: ReelKitIOS

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0
  reelkit_platform_interface: ^0.1.0-dev.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
