name: reelkit_ios
description: iOS implementation of ReelKit, built on AVFoundation AVPlayer.
version: 0.1.0-dev.3
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: reelkit
    platforms:
      ios:
        pluginClass: ReelKitPlugin
        dartPluginClass: ReelKitIOS

dependencies:
  flutter:
    sdk: flutter
  reelkit_platform_interface: ^0.1.0-dev.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
