name: reelkit_web
description: Web implementation of ReelKit, the Flutter video feed and playback plugin, built on HTMLVideoElement.
version: 0.1.0-dev.7
homepage: https://github.com/ANILSRGT/reelkit
repository: https://github.com/ANILSRGT/reelkit/tree/main/packages/reelkit_web
issue_tracker: https://github.com/ANILSRGT/reelkit/issues
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

flutter:
  plugin:
    implements: reelkit
    platforms:
      web:
        pluginClass: ReelKitWeb
        fileName: reelkit_web.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  reelkit_platform_interface: ^0.1.0-dev.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
