name: playstack_workspace
description: Development workspace for the PlayStack federated Flutter plugin.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/playstack
  - packages/playstack/example
  - packages/playstack_platform_interface
  - packages/playstack_android
  - packages/playstack_ios
  - packages/playstack_web
  - demo

dev_dependencies:
  pigeon: ^29.2.0
